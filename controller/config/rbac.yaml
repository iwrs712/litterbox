apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-controller
  namespace: litterbox
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: litterbox-sandbox-controller
rules:
  - apiGroups:
      - litterbox.io
    resources:
      - sandboxes
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - litterbox.io
    resources:
      - sandboxes/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - ""
    resources:
      - pods
      - persistentvolumeclaims
    verbs:
      - get
      - list
      - watch
      - create
      - delete
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: litterbox-sandbox-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: litterbox-sandbox-controller
subjects:
  - kind: ServiceAccount
    name: sandbox-controller
    namespace: litterbox
---
# The orchestrator writes Sandbox resources and reads their status. It no
# longer needs to create Deployments when sandbox.backend = "crd".
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: litterbox-sandbox-crd-writer
rules:
  - apiGroups:
      - litterbox.io
    resources:
      - sandboxes
      - sandboxes/status
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: litterbox-orchestrator-sandboxes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: litterbox-sandbox-crd-writer
subjects:
  - kind: ServiceAccount
    name: orchestrator
    namespace: litterbox
