apiVersion: v1
kind: Pod
metadata:
  name: kata-firecracker-smoke
  namespace: litterbox
  labels:
    app.kubernetes.io/name: kata-firecracker-smoke
    app.kubernetes.io/part-of: litterbox
    litterbox.io/purpose: runtime-smoke-test
spec:
  runtimeClassName: kata-fc
  restartPolicy: Never
  containers:
    - name: probe
      image: alpine:3.20
      command: ["/bin/sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 100m
          memory: 128Mi
