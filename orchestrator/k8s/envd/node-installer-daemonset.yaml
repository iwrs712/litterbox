apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: envd-node-installer
  namespace: litterbox
  labels:
    app.kubernetes.io/name: envd-node-installer
    app.kubernetes.io/part-of: litterbox
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: envd-node-installer
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: envd-node-installer
        app.kubernetes.io/part-of: litterbox
    spec:
      nodeSelector:
        katacontainers.io/kata-runtime: "true"
        kubernetes.io/arch: amd64
      imagePullSecrets:
        - name: harbor-pull-secret
      initContainers:
        - name: installer
          image: registry.runlet.cn/litterbox/envd-node-installer:0.1.0-amd64
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              cp /payload/sandbox-agent /host-bin/.sandbox-agent.new
              chmod 0755 /host-bin/.sandbox-agent.new
              mv -f /host-bin/.sandbox-agent.new /host-bin/sandbox-agent
              test -x /host-bin/sandbox-agent
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: envd-host-bin
              mountPath: /host-bin
      containers:
        - name: ready
          image: registry.runlet.cn/litterbox/envd-node-installer:0.1.0-amd64
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - test -x /host-bin/sandbox-agent && exec sleep infinity
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 0
          resources:
            requests:
              cpu: 1m
              memory: 2Mi
            limits:
              cpu: 20m
              memory: 16Mi
          volumeMounts:
            - name: envd-host-bin
              mountPath: /host-bin
              readOnly: true
      volumes:
        - name: envd-host-bin
          hostPath:
            path: /opt/litterbox/bin
            type: DirectoryOrCreate
